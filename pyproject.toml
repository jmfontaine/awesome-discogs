[project]
name = "awesome-discogs"
version = "0"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
lint.select = ["B", "DTZ", "E", "F", "I", "RUF", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
site = [
    "pelican>=4.12.0",
]
