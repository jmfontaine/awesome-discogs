name: Report a problem
description: A dead link, an entry that no longer meets the criteria, or an error in the list
labels: ["triage"]
body:
  - type: input
    id: entry
    attributes:
      label: Entry
      description: The entry or section concerned.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What is wrong, with evidence such as an archived repository or the date of the last release.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: What the list should say instead, or whether the entry should be removed.
