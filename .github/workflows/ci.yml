name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Only the `CI passed` job is a required check, and it needs every other job, so jobs can be added or renamed without
# touching the ruleset. Keep its `needs` in step with the jobs.

jobs:
  awesome-lint:
    name: awesome-lint
    runs-on: ubuntu-26.04
    steps:
      # awesome-lint reads the git history, so it needs a full clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npx --yes awesome-lint README.md

  links:
    name: Links
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml README.md CONTRIBUTING.md

  tools:
    name: Tools
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pytest
      - name: Build the website
        run: uv run --locked --group site pelican --settings site/pelicanconf.py --fatal warnings

  entries:
    name: Entries
    runs-on: ubuntu-26.04
    steps:
      # The pull request check reads README.md from the merge commit's first parent.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run --locked python -m tools check
      - name: Check the entries this pull request adds
        if: github.event_name == 'pull_request'
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --locked python -m tools pr --base HEAD^1 --author-association "$AUTHOR_ASSOCIATION"

  ci-passed:
    name: CI passed
    needs: [awesome-lint, links, tools, entries]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Fail unless every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
