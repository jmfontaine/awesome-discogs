name: Deploy

# Builds the website from the list and uploads it to the Cloudflare Worker that serves
# https://awesome-discogs.com. The Worker, its domain and its redirects are managed
# outside this repository; this workflow only uploads the files.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deployments run one at a time, and a run whose commit is no longer the tip of main
# uploads nothing, so a late or rerun older build never replaces a newer one.
concurrency:
  group: deploy

jobs:
  deploy:
    name: Deploy
    # A manual run can start from any branch; only main reaches the website.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that this commit is still the tip of main
        id: tip
        run: |
          set -o pipefail
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipped: main has moved on to $tip, whose own run deploys it."
          fi
      - if: steps.tip.outputs.latest == 'true'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Build the website
        if: steps.tip.outputs.latest == 'true'
        run: uvx --from rust-just just site
      - name: Upload the website
        if: steps.tip.outputs.latest == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: site
